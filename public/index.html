<!-- public/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Chess Rooms</title>
</head>
<body>
  <div id="rooms">
    <form id="create-room">
      <input id="room-name" name="name" type="text">
      <button type="submit">Create</button>
    </form>
    <p id="room-error"></p>
    <div id="room-list"></div>
  </div>
  <div id="board"></div>
  <div id="tournaments"></div>
  <script>
    const POLL_MS = 1000;

    async function createRoom(name) {
      const res = await fetch("/api/rooms", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const body = await res.json();
      if (!res.ok) {
        document.getElementById("room-error").textContent = body.error || "";
        return body;
      }
      document.getElementById("room-error").textContent = "";
      await refreshRooms();
      return body;
    }

    function renderRooms(rooms) {
      const list = document.getElementById("room-list");
      list.replaceChildren();
      for (const room of rooms) {
        const row = document.createElement("button");
        row.type = "button";
        row.textContent = room.name;
        row.addEventListener("click", () => openRoom(room));
        list.appendChild(row);
      }
    }

    function openRoom(room) {
      document.getElementById("board").textContent = room.name;
    }

    async function refreshRooms() {
      const res = await fetch("/api/rooms");
      const body = await res.json();
      renderRooms(body.rooms);
      return body;
    }

    document.getElementById("create-room").addEventListener("submit", (event) => {
      event.preventDefault();
      createRoom(document.getElementById("room-name").value);
    });

    setInterval(refreshRooms, POLL_MS);
  </script>
</body>
</html>
