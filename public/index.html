<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chess Rooms</title>
</head>
<body>
  <h1>Chess Rooms</h1>
  <form>
    <input type="text" id="name" name="name">
    <button type="button" data-action="open">Open room</button>
    <button type="button" data-action="sit-white">Sit white</button>
    <button type="button" data-action="sit-black">Sit black</button>
  </form>
  <div id="rooms"></div>
  <div id="board"></div>
  <div id="tournaments"></div>
  <script type="module" src="/play.js"></script>
</body>
</html>
