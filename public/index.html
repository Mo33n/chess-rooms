<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chess Rooms</title>
</head>
<body>
  <h1>Chess Rooms</h1>
  <form>
    <label for="name">Name</label>
    <input type="text" id="name" name="name">
    <button type="button" data-action="open">Open room</button>
    <button type="button" data-action="sit-white">Sit white</button>
    <button type="button" data-action="sit-black">Sit black</button>
  </form>
  <div id="rooms"></div>
  <div id="board"></div>
  <form>
    <label for="tournament-name">Tournament</label>
    <input type="text" id="tournament-name" name="tournament-name">
    <button type="button" data-action="host">Host</button>
    <label for="player-name">Player</label>
    <input type="text" id="player-name" name="player-name">
    <button type="button" data-action="add-player">Add player</button>
    <button type="button" data-action="start-tournament">Start</button>
    <button type="button" data-action="next-round">Next round</button>
  </form>
  <div id="tournaments"></div>
  <script type="module" src="/play.js"></script>
</body>
</html>
