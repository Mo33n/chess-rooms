<!-- public/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Chess Rooms</title>
</head>
<body>
  <div id="rooms">
    <form id="create-room">
      <label for="room-name">Room name</label>
      <input id="room-name" name="name" type="text">
      <button type="submit">Create</button>
    </form>
    <p id="room-error"></p>
    <div id="room-list"></div>
  </div>
  <div id="board"></div>
  <div id="tournaments">
    <form id="create-tournament">
      <label for="tournament-name">Tournament name</label>
      <input id="tournament-name" name="name" type="text">
      <button type="submit">Create tournament</button>
    </form>
    <form id="add-player">
      <label for="player-name">Player name</label>
      <input id="player-name" name="name" type="text">
      <button type="submit">Add player</button>
    </form>
    <form id="start-tournament">
      <button type="submit">Start</button>
    </form>
    <p id="tournament-error"></p>
    <div id="tournament-view"></div>
  </div>
  <script>
    const POLL_MS = 1000;

    async function createRoom(name) {
      const res = await fetch("/api/rooms", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const body = await res.json();
      if (!res.ok) {
        document.getElementById("room-error").textContent = body.error || "";
        return body;
      }
      document.getElementById("room-error").textContent = "";
      await refreshRooms();
      return body;
    }

    function sameRooms(list, rooms) {
      const rows = list.children;
      if (rows.length !== rooms.length) return false;
      for (let i = 0; i < rooms.length; i++) {
        if (rows[i].dataset.roomId !== rooms[i].id) return false;
      }
      return true;
    }

    function renderRooms(rooms) {
      const list = document.getElementById("room-list");
      if (sameRooms(list, rooms)) return;
      const active = document.activeElement;
      const activeId = active && active.dataset ? active.dataset.roomId : "";
      list.replaceChildren();
      for (const room of rooms) {
        const row = document.createElement("button");
        row.type = "button";
        row.dataset.roomId = room.id;
        row.textContent = room.name;
        row.addEventListener("click", () => openRoom(room));
        list.appendChild(row);
      }
      if (!activeId) return;
      for (const row of list.children) {
        if (row.dataset.roomId === activeId) row.focus();
      }
    }

    let openId = null;
    let seatToken = null;

    function mountBoard(room) {
      const board = document.getElementById("board");
      board.replaceChildren();
      board.dataset.roomId = room.id;
      const title = document.createElement("p");
      title.id = "open-room-name";
      board.appendChild(title);
      const whiteSeat = document.createElement("p");
      whiteSeat.id = "seat-white";
      board.appendChild(whiteSeat);
      const blackSeat = document.createElement("p");
      blackSeat.id = "seat-black";
      board.appendChild(blackSeat);
      const seatError = document.createElement("p");
      seatError.id = "seat-error";
      board.appendChild(seatError);
      for (const color of ["white", "black"]) {
        const form = document.createElement("form");
        form.id = "sit-" + color;
        const input = document.createElement("input");
        input.id = color + "-name";
        input.type = "text";
        const label = document.createElement("label");
        label.htmlFor = input.id;
        label.textContent = color === "white" ? "White" : "Black";
        const button = document.createElement("button");
        button.type = "submit";
        button.textContent = "Sit " + color;
        form.appendChild(label);
        form.appendChild(input);
        form.appendChild(button);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          return sit(color, input.value);
        });
        board.appendChild(form);
      }
      const moveForm = document.createElement("form");
      moveForm.id = "move-form";
      const uci = document.createElement("input");
      uci.id = "uci";
      uci.type = "text";
      const moveLabel = document.createElement("label");
      moveLabel.htmlFor = uci.id;
      moveLabel.textContent = "Move";
      const moveButton = document.createElement("button");
      moveButton.type = "submit";
      moveButton.textContent = "Move";
      moveForm.appendChild(moveLabel);
      moveForm.appendChild(uci);
      moveForm.appendChild(moveButton);
      moveForm.addEventListener("submit", (event) => {
        event.preventDefault();
        return playMove(uci.value);
      });
      board.appendChild(moveForm);
      const grid = document.createElement("div");
      grid.id = "position";
      board.appendChild(grid);
      const status = document.createElement("p");
      status.id = "board-status";
      board.appendChild(status);
    }

    function drawPosition(room) {
      const grid = document.getElementById("position");
      grid.replaceChildren();
      for (const rank of room.position || []) {
        const row = document.createElement("div");
        for (const piece of rank) {
          const cell = document.createElement("span");
          cell.textContent = piece;
          row.appendChild(cell);
        }
        grid.appendChild(row);
      }
      const words = [];
      if (room.status === "checkmate") {
        words.push("checkmate");
        if (room.winner) words.push(room.winner);
      } else if (room.status === "stalemate") {
        words.push("stalemate");
      } else if (room.check) {
        words.push("check");
      }
      document.getElementById("board-status").textContent = words.length ? " " + words.join(" ") : "";
    }

    function showSeats(room) {
      const board = document.getElementById("board");
      if (board.dataset.roomId !== room.id) mountBoard(room);
      document.getElementById("open-room-name").textContent = room.name;
      document.getElementById("seat-white").textContent = "White: " + (room.white == null ? "empty" : room.white);
      document.getElementById("seat-black").textContent = "Black: " + (room.black == null ? "empty" : room.black);
      drawPosition(room);
    }

    async function openRoom(room) {
      openId = room.id;
      seatToken = null;
      const res = await fetch("/api/rooms/" + room.id);
      const body = await res.json();
      showSeats(body);
      return body;
    }

    async function refreshOpen() {
      if (!openId) return null;
      const res = await fetch("/api/rooms/" + openId);
      if (!res.ok) return null;
      const body = await res.json();
      showSeats(body);
      return body;
    }

    async function sit(color, name) {
      if (!openId || name.length === 0) return null;
      const res = await fetch("/api/rooms/" + openId + "/join", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name, color }),
      });
      const body = await res.json();
      if (!res.ok) {
        document.getElementById("seat-error").textContent = body.error || "";
        return body;
      }
      document.getElementById("seat-error").textContent = "";
      seatToken = body.token;
      showSeats(body.room);
      return body;
    }

    async function playMove(uci) {
      if (!openId || !seatToken) {
        const seatError = document.getElementById("seat-error");
        if (seatError) seatError.textContent = "sit down first";
        return null;
      }
      const res = await fetch("/api/rooms/" + openId + "/move", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ token: seatToken, uci }),
      });
      const body = await res.json();
      if (!res.ok) {
        document.getElementById("seat-error").textContent = body.error || "";
        return { status: res.status, body };
      }
      document.getElementById("seat-error").textContent = "played " + uci;
      showSeats(body);
      return { status: res.status, body };
    }

    async function refreshRooms() {
      const res = await fetch("/api/rooms");
      const body = await res.json();
      renderRooms(body.rooms);
      return body;
    }

    let tournamentId = null;

    function ensureChild(root, node) {
      for (const child of root.children) {
        if (child === node) return node;
      }
      root.appendChild(node);
      return node;
    }

    function tournamentNodes() {
      const root = document.getElementById("tournaments");
      return {
        error: ensureChild(root, document.getElementById("tournament-error")),
        view: ensureChild(root, document.getElementById("tournament-view")),
      };
    }

    function renderTournament(tournament) {
      const view = tournamentNodes().view;
      view.replaceChildren();
      const name = document.createElement("p");
      name.textContent = tournament.name;
      view.appendChild(name);
      for (const player of tournament.players) {
        const row = document.createElement("p");
        row.textContent = player.name;
        view.appendChild(row);
      }
      const round = tournament.rounds[tournament.rounds.length - 1];
      if (!round) return;
      const heading = document.createElement("p");
      heading.textContent = String(round.round);
      view.appendChild(heading);
      for (const pairing of round.pairings) {
        const row = document.createElement("p");
        row.textContent = pairing.white + " " + pairing.black;
        view.appendChild(row);
      }
    }

    async function createTournament(name) {
      const res = await fetch("/api/tournaments", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const body = await res.json();
      const nodes = tournamentNodes();
      if (!res.ok) {
        nodes.error.textContent = body.error || "";
        return body;
      }
      tournamentId = body.id;
      nodes.error.textContent = "";
      renderTournament(body);
      return body;
    }

    async function addPlayer(name) {
      if (!tournamentId) return null;
      const res = await fetch("/api/tournaments/" + tournamentId + "/players", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ name }),
      });
      const body = await res.json();
      const nodes = tournamentNodes();
      if (!res.ok) {
        nodes.error.textContent = body.error || "";
        return body;
      }
      nodes.error.textContent = "";
      renderTournament(body);
      return body;
    }

    async function startTournament() {
      if (!tournamentId) return null;
      const res = await fetch("/api/tournaments/" + tournamentId + "/start", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({}),
      });
      const body = await res.json();
      const nodes = tournamentNodes();
      if (!res.ok) {
        nodes.error.textContent = body.error || "";
        return body;
      }
      nodes.error.textContent = "";
      renderTournament(body);
      await refreshRooms();
      return body;
    }

    document.getElementById("create-room").addEventListener("submit", (event) => {
      event.preventDefault();
      return createRoom(document.getElementById("room-name").value);
    });

    document.getElementById("create-tournament").addEventListener("submit", (event) => {
      event.preventDefault();
      return createTournament(document.getElementById("tournament-name").value);
    });

    document.getElementById("add-player").addEventListener("submit", (event) => {
      event.preventDefault();
      return addPlayer(document.getElementById("player-name").value);
    });

    document.getElementById("start-tournament").addEventListener("submit", (event) => {
      event.preventDefault();
      return startTournament();
    });

    setInterval(() => {
      refreshRooms();
      refreshOpen();
    }, POLL_MS);
  </script>
</body>
</html>
